# GitLab CI/CD Configuration for API Tests
# https://docs.gitlab.com/ee/ci/yaml/

variables:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ALLURE_RESULTS: "allure-results"
  ALLURE_REPORT: "allure-report"

stages:
  - lint
  - test
  - report
  - notify

# Cache pip dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

#-----------------------------------------------------------
# Stage: Lint
#-----------------------------------------------------------
lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install flake8 black isort
  script:
    - |
      echo "Running code quality checks..."
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      black --check . || true
      isort --check-only --diff . || true
  allow_failure: true
  artifacts:
    paths:
      - flake8-report.txt
    expire_in: 1 day

#-----------------------------------------------------------
# Stage: Test - Smoke Tests
#-----------------------------------------------------------
test_smoke:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
    - pip install pytest pytest-xdist pytest-allure allure-python-py2
    - npm install -g allure-commandline || true
  script:
    - |
      echo "Running Smoke Tests..."
      pytest tests/ -m "smoke" -v --tb=short --alluredir=${ALLURE_RESULTS} -n auto
  artifacts:
    paths:
      - ${ALLURE_RESULTS}/
    expire_in: 7 days
    when: always
  coverage: '/TOTAL.*\s+(\d+%)$/'
  tags:
    - docker

