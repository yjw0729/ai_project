#-----------------------------------------------------------
# Stage: Report - Generate Allure Report
#-----------------------------------------------------------
generate_report:
  stage: report
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install allure-python-py2
  script:
    - |
      echo "Generating Allure Report..."
      if [ -d "${ALLURE_RESULTS}" ] && [ "$(ls -A ${ALLURE_RESULTS})" ]; then
        allure generate ${ALLURE_RESULTS} -o ${ALLURE_REPORT} --clean
      else
        echo "No test results found, skipping report generation"
        exit 0
      fi
  artifacts:
    paths:
      - ${ALLURE_REPORT}/
    expire_in: 30 days
    when: always
  needs:
    - job: test_smoke
      optional: true
    - job: test_regression
      optional: true
    - job: test_cicd
      optional: true
    - job: test_p0
      optional: true

#-----------------------------------------------------------
# Stage: Notify - Send Notifications
#-----------------------------------------------------------
notify_failure:
  stage: notify
  image: python:${PYTHON_VERSION}-slim
  script:
    - |
      echo "Sending failure notification..."
      # Add your notification logic here (Slack, Email, DingTalk, etc.)
      echo "Test pipeline failed! Check the results at: ${CI_PIPELINE_URL}"
  only:
    - main
    - develop
    - schedules
  when: on_failure
  tags:
    - docker

notify_success:
  stage: notify
  image: python:${PYTHON_VERSION}-slim
  script:
    - |
      echo "Sending success notification..."
      # Add your notification logic here (Slack, Email, DingTalk, etc.)
      echo "All tests passed! Pipeline completed successfully."
  only:
    - main
    - develop
    - schedules
  when: on_success
  tags:
    - docker

#-----------------------------------------------------------
# Full Test Suite (Scheduled Pipeline Only)
#-----------------------------------------------------------
test_full_suite:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
    - pip install pytest pytest-xdist pytest-allure allure-python-py2
    - npm install -g allure-commandline || true
  script:
    - |
      echo "Running Full Test Suite..."
      pytest tests/ -v --tb=short --alluredir=${ALLURE_RESULTS} -n auto
  artifacts:
    paths:
      - ${ALLURE_RESULTS}/
    expire_in: 14 days
    when: always
  only:
    - schedules
  allow_failure: true
  tags:
    - docker