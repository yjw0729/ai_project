    enabled: true
    tags: ["smoke", "regression"]
    priority: "high"
    json: {
      "data": {
        "requestId": "{{requestId}}",
        "rootMchId": "600600011000072",
        "callBackUrl": "http://www.baidu.com",
        "frontUrl": "http://www.baidu.com",
        "orderExpired": "60",
        "xmBatchActionList": [
          {
            "businessOrderNo": "{{businessOrderNo}}",
            "businessType": "XM_EVAL",
            "xmBusinessSubOrderList": [
              {
                "businessSubOrderNo": "{{businessSubOrderNo}}",
                "sceneType": "XM_EVAL",
                "businessSubOrderAmt": 5.01,
                "tradeInfo": [
                  {
                    "businessTradeOrderNo": "{{businessTradeOrderNo}}",
                    "orderAmt": 5.01,
                    "payerMno": "600600011000072",
                    "payerAcType": "YXH",
                    "productInfos": [
                      {
                        "orderNo": "31312312312297630553",
