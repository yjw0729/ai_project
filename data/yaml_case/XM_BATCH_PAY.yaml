test_suit: "XM_BATCH_PAY接口自动化测试"
description: "三代opts系统-批量支付接口测试套件"
base_url: "http://22.50.8.21:8080/xmBusiness"
endpoint: "/xmPay/XM_BATCH_PAY"
method: "POST"

global_config:
  headers:
    Connect-type: "application/json"
  timeout: 30
  retry_time: 1

