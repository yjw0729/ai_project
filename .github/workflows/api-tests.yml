name: API Tests CI/CD

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点执行

env:
  PYTHON_VERSION: '3.12'
  PYTHONUNBUFFERED: '1'

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            */requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
          pip install pytest pytest-xdist pytest-allure
      
      - name: Run smoke tests
        run: |
          pytest tests/ -m "smoke" -v --tb=short --alluredir=allure-results
        continue-on-error: true
      
      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: allure-results/
          retention-days: 7
      
      - name: Generate Allure report
        if: always()
        run: |
          pip install allure-python-py2
          allure generate allure-results -o allure-report --clean
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report
          path: allure-report/
          retention-days: 30

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            */requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
          pip install pytest pytest-xdist pytest-allure
      
      - name: Run regression tests
        run: |
          pytest tests/ -m "regression" -v --tb=short --alluredir=allure-results -n auto
        continue-on-error: true
      
      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: allure-results/
          retention-days: 7
      
      - name: Generate Allure report
        if: always()
        run: |
          pip install allure-python-py2
          allure generate allure-results -o allure-report --clean
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-report
          path: allure-report/
          retention-days: 30

  ci-cd-tests:
    name: CI/CD Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            */requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
          pip install pytest pytest-xdist pytest-allure
      
      - name: Run CI/CD tests
        run: |
          pytest tests/ -m "ci_cd" -v --tb=short --alluredir=allure-results -n auto
        continue-on-error: true
      
      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-test-results
          path: allure-results/
          retention-days: 7
      
      - name: Generate Allure report
        if: always()
        run: |
          pip install allure-python-py2
          allure generate allure-results -o allure-report --clean
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-allure-report
          path: allure-report/
          retention-days: 30

  priority-p0-tests:
    name: P0 Priority Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            */requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
          pip install pytest pytest-xdist pytest-allure
      
      - name: Run P0 tests
        run: |
          pytest tests/ -m "P0" -v --tb=short --alluredir=allure-results -n auto
        continue-on-error: true
      
      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-results
          path: allure-results/
          retention-days: 7
      
      - name: Generate Allure report
        if: always()
        run: |
          pip install allure-python-py2
          allure generate allure-results -o allure-report --clean
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-allure-report
          path: allure-report/
          retention-days: 30

  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            */requirements*.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install -r test_requirements.txt 2>/dev/null || true
          pip install pytest pytest-xdist pytest-allure
      
      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short --alluredir=allure-results -n auto
        continue-on-error: true
      
      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results
          path: allure-results/
          retention-days: 14
      
      - name: Generate Allure report
        if: always()
        run: |
          pip install allure-python-py2
          allure generate allure-results -o allure-report --clean
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-allure-report
          path: allure-report/
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, ci-cd-tests, priority-p0-tests]
    if: always()
    
    steps:
      - name: Create status summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Tests | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CI/CD Tests | ${{ needs.ci-cd-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| P0 Priority Tests | ${{ needs.priority-p0-tests.result }} |" >> $GITHUB_STEP_SUMMARY