[pytest]
# 仅保留不依赖插件的选项，避免未安装 allure-pytest / pytest-json-report / pytest-rerunfailures 时
# 在命令行直接运行 pytest 报错。Allure/JSON 报告由 core.runner.TestRunner 或显式传参启用。
addopts = -vs --tb=short -p no:warnings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试标记配置
markers =
    smoke: 冒烟测试
    regression: 回归测试
    ci_cd: CI/CD 集成
    P0: P0优先级
    P1: P1优先级
    P2: P2优先级
    P3: P3优先级
    no_retry: 不进行失败重试


log_file = ./logs/pytest.log
log_file_level = info
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] : %(message)s
log_file_date_formate = %Y-%m-%d %H:%M:%S

result_log_enable = 1
result_log_separator = 1
result_log_level_separator = warning
result_log_level_verbose = info