version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pytest_sxp_rabbitmq
    hostname: pytest_sxp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pytest_sxp_2026
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - pytest_sxp_net

volumes:
  rabbitmq_data:

networks:
  pytest_sxp_net:
    driver: bridge
